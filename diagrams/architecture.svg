<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>

  <text x="40" y="45" font-size="24" font-weight="700" fill="#1f2937">Walmart Data Platform: Architecture</text>
  <text x="40" y="70" font-size="14" fill="#6b7280">CDC + files → medallion layers → star schema, orchestrated by a Databricks Workflows job</text>

  <!-- Users and chatbot -->
  <circle cx="110" cy="118" r="12" fill="#d6336c"/>
  <circle cx="130" cy="112" r="12" fill="#e64980"/>
  <circle cx="150" cy="118" r="12" fill="#d6336c"/>
  <path d="M130 138 L130 176" stroke="#444" stroke-width="2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="145" y="162" font-size="13" fill="#374151">SQL Chatbot</text>

  <!-- Source: Postgres -->
  <rect x="50" y="180" width="170" height="110" rx="14" fill="#e7f1ff" stroke="#4a7fc1" stroke-width="2"/>
  <rect x="109" y="205" width="52" height="22" fill="#4a7fc1"/>
  <ellipse cx="135" cy="205" rx="26" ry="8" fill="#6c9bd6"/>
  <ellipse cx="135" cy="227" rx="26" ry="8" fill="#4a7fc1"/>
  <text x="135" y="262" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Agentic DB</text>
  <text x="135" y="280" font-size="12" text-anchor="middle" fill="#4b5563">PostgreSQL on Neon</text>

  <!-- Source: S3 -->
  <rect x="50" y="330" width="170" height="110" rx="14" fill="#e9f7ec" stroke="#4c9a5a" stroke-width="2"/>
  <path d="M112 352 L158 352 L152 388 L118 388 Z" fill="#4c9a5a"/>
  <ellipse cx="135" cy="352" rx="23" ry="7" fill="#74b97f"/>
  <text x="135" y="414" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">AWS S3</text>
  <text x="135" y="431" font-size="12" text-anchor="middle" fill="#4b5563">raw files</text>

  <!-- Boundary between sources and Databricks -->
  <line x1="265" y1="90" x2="265" y2="470" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Arrows from sources -->
  <path d="M220 235 L318 255" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="245" y="234" width="48" height="22" rx="6" fill="#cfe3ff" stroke="#4a7fc1"/>
  <text x="269" y="250" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">CDC</text>

  <path d="M220 385 L318 325" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="245" y="344" width="48" height="22" rx="6" fill="#cdeed3" stroke="#4c9a5a"/>
  <text x="269" y="360" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">Files</text>

  <!-- Databricks job container -->
  <rect x="290" y="100" width="880" height="470" rx="18" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="310" y="112" width="330" height="30" rx="15" fill="#ff3621"/>
  <text x="325" y="132" font-size="14" font-weight="700" fill="#ffffff">Databricks Job: walmart_orchestrate</text>

  <!-- Bronze -->
  <rect x="320" y="175" width="200" height="190" rx="14" fill="#fff1e6" stroke="#e07b39" stroke-width="2"/>
  <text x="420" y="203" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937">Bronze</text>
  <text x="420" y="226" font-size="14" text-anchor="middle" fill="#374151">Incremental</text>
  <text x="420" y="244" font-size="14" text-anchor="middle" fill="#374151">ingestion</text>
  <text x="420" y="282" font-size="12" text-anchor="middle" fill="#6b7280">Databricks pipeline</text>
  <text x="420" y="300" font-size="12" text-anchor="middle" font-family="Consolas, monospace" fill="#6b7280">ingest_walmart</text>
  <text x="420" y="330" font-size="12" text-anchor="middle" fill="#6b7280">Delta tables</text>

  <!-- Arrow bronze to silver -->
  <path d="M520 270 L598 270" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="560" y="292" font-size="11" text-anchor="middle" fill="#555">freshness</text>
  <text x="560" y="305" font-size="11" text-anchor="middle" fill="#555">gate</text>

  <!-- Silver -->
  <rect x="600" y="175" width="230" height="190" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="715" y="203" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937">Silver</text>
  <text x="715" y="226" font-size="14" text-anchor="middle" fill="#374151">One Big Table</text>
  <rect x="635" y="240" width="40" height="28" rx="3" fill="#ffffff" stroke="#6b7280"/>
  <rect x="680" y="240" width="40" height="28" rx="3" fill="#ffffff" stroke="#6b7280"/>
  <rect x="725" y="240" width="40" height="28" rx="3" fill="#ffffff" stroke="#6b7280"/>
  <text x="715" y="300" font-size="12" text-anchor="middle" fill="#6b7280">technical layer → business layer</text>
  <text x="715" y="330" font-size="12" text-anchor="middle" fill="#6b7280">cleaned, typed, conformed</text>
  <rect x="770" y="157" width="56" height="24" rx="6" fill="#ff694a"/>
  <text x="798" y="174" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">dbt</text>

  <!-- Arrow silver to gold -->
  <path d="M830 270 L908 270" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="870" y="292" font-size="11" text-anchor="middle" fill="#555">tests</text>
  <text x="870" y="305" font-size="11" text-anchor="middle" fill="#555">gate</text>

  <!-- Gold -->
  <rect x="910" y="175" width="230" height="190" rx="14" fill="#fff9db" stroke="#d4a017" stroke-width="2"/>
  <text x="1025" y="203" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937">Gold</text>
  <text x="1025" y="226" font-size="14" text-anchor="middle" fill="#374151">Star schema</text>
  <text x="1025" y="268" font-size="12" text-anchor="middle" fill="#6b7280">dimensions: SCD2 snapshots</text>
  <text x="1025" y="288" font-size="12" text-anchor="middle" fill="#6b7280">facts: dbt models</text>
  <text x="1025" y="308" font-size="12" text-anchor="middle" fill="#6b7280">ephemeral helper models</text>
  <rect x="1080" y="157" width="56" height="24" rx="6" fill="#ff694a"/>
  <text x="1108" y="174" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">dbt</text>

  <!-- Quality checks -->
  <rect x="615" y="385" width="200" height="34" rx="17" fill="#e7f1ff" stroke="#4a7fc1"/>
  <text x="715" y="407" font-size="13" text-anchor="middle" fill="#1f2937">dbt tests: quality checks</text>

  <!-- Task graph -->
  <text x="320" y="455" font-size="13" font-weight="700" fill="#374151">Task graph: 9 dependent tasks, one run, one schedule</text>
  <line x1="320" y1="494" x2="1142" y2="494" stroke="#9ca3af" stroke-width="2"/>

  <rect x="320" y="477" width="86" height="34" rx="8" fill="#ffe2cf" stroke="#e07b39"/>
  <text x="363" y="498" font-size="11" text-anchor="middle" fill="#1f2937">ingest_cdc</text>

  <rect x="412" y="477" width="86" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="455" y="498" font-size="11" text-anchor="middle" fill="#1f2937">freshness</text>

  <rect x="504" y="477" width="86" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="547" y="498" font-size="11" text-anchor="middle" fill="#1f2937">silver_tech</text>

  <rect x="596" y="477" width="86" height="34" rx="8" fill="#dbeafe" stroke="#4a7fc1"/>
  <text x="639" y="498" font-size="11" text-anchor="middle" fill="#1f2937">tech_tests</text>

  <rect x="688" y="477" width="86" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="731" y="498" font-size="11" text-anchor="middle" fill="#1f2937">silver_biz</text>

  <rect x="780" y="477" width="86" height="34" rx="8" fill="#dbeafe" stroke="#4a7fc1"/>
  <text x="823" y="498" font-size="11" text-anchor="middle" fill="#1f2937">biz_tests</text>

  <rect x="872" y="477" width="86" height="34" rx="8" fill="#fff3bf" stroke="#d4a017"/>
  <text x="915" y="498" font-size="11" text-anchor="middle" fill="#1f2937">gold_ephem</text>

  <rect x="964" y="477" width="86" height="34" rx="8" fill="#fff3bf" stroke="#d4a017"/>
  <text x="1007" y="498" font-size="11" text-anchor="middle" fill="#1f2937">snapshots</text>

  <rect x="1056" y="477" width="86" height="34" rx="8" fill="#fff3bf" stroke="#d4a017"/>
  <text x="1099" y="498" font-size="11" text-anchor="middle" fill="#1f2937">gold_fact</text>

  <text x="320" y="545" font-size="12" fill="#6b7280">Cron schedule (Africa/Lagos) · retries on ingestion · failure email alerts · dbt code pulled from GitHub</text>

  <!-- Footnote -->
  <text x="40" y="610" font-size="13" fill="#6b7280">Orchestration: Databricks Workflows (replaces Apache Airflow). Serverless compute, runs in the cloud with no always-on server.</text>
</svg>
